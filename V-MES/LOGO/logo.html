<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<title>V-MES Logo</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:transparent}
.logo{display:inline-flex;align-items:center;gap:16px;padding:40px;font-family:Montserrat,sans-serif}
.logo img{width:300px;height:300px}
.wm{display:flex;flex-direction:column;gap:14px}
.name{font-size:236px;font-weight:900;line-height:.9;letter-spacing:-.02em;white-space:nowrap}
.mes{background:linear-gradient(90deg,#1E4A8A 0%,#1F7A6B 45%,#20B04B 100%);-webkit-background-clip:text;color:transparent}
.tl{font-size:31px;line-height:1.3;font-weight:600;letter-spacing:.2em;color:#1F6E62;white-space:nowrap;padding-left:6px}
.white .mes{background:none;color:#fff}.white .tl{color:#D1FAE5}
.icon .wm{display:none}.compact .tl{display:none}.compact{gap:14px}
</style></head><body>
<div class="logo" id="logo"><img id="em" src="emblem.png" alt=""><div class="wm"><div class="name"><span class="mes">MES</span></div><div class="tl">MANUFACTURING<br>EXECUTION SYSTEM</div></div></div>
<script>
const v=new URLSearchParams(location.search).get("v")||"";
if(v)document.getElementById("logo").classList.add(...v.split(","));
if(v.includes("white"))document.getElementById("em").src="emblem-white.png";
</script>
</body></html>
